blueprint:
  name: Daily Challenge voice commands
  description: >-
    Lets you update and check your Daily Challenges with Assist, e.g. "Add 20
    to push-ups" or "How many push-ups today". One automation covers all
    challenges; `{challenge}` is the name of the challenge and `{amount}` a
    number. The sentences and answers are in English by default; replace
    them with sentences in your language. In the answers you can use
    `{{ challenge }}`, `{{ amount }}`, `{{ done }}`, `{{ target }}`,
    `{{ unit }}` and `{{ streak }}`. A challenge that counts by itself from a
    daily source sensor can only be asked, not added to.
  domain: automation
  author: Skylolerr
  source_url: https://github.com/Skylolerr/ha-daily-challenge/blob/main/blueprints/automation/daily_challenge/voice.yaml
  homeassistant:
    min_version: "2026.10.0"
  input:
    add_sentences:
      name: Sentences to add
      description: Must contain `{amount}` and `{challenge}`.
      default:
        - "add {amount} to {challenge}"
        - "log {amount} for {challenge}"
      selector:
        text:
          multiple: true
    add_answer:
      name: Answer after adding
      default: "Done. {{ done }} of {{ target }} {{ unit }} today."
      selector:
        text: {}
    status_sentences:
      name: Sentences to ask
      description: Must contain `{challenge}`.
      default:
        - "how many {challenge} today"
        - "how much {challenge} today"
        - "{challenge} status"
      selector:
        text:
          multiple: true
    status_answer:
      name: Answer to a question
      default: >-
        {{ challenge }}: {{ done }} of {{ target }} {{ unit }} today, streak
        {{ streak }} {{ 'day' if streak | int == 1 else 'days' }}.
      selector:
        text: {}
    unknown_answer:
      name: Answer for an unknown challenge
      default: "I don't know a challenge called {{ challenge }}."
      selector:
        text: {}
    not_running_answer:
      name: Answer when the challenge is not running
      default: "{{ challenge }} is not running today."
      selector:
        text: {}
    source_answer:
      name: Answer when a sensor counts
      default: "{{ challenge }} counts by itself from its sensor today."
      selector:
        text: {}
    no_amount_answer:
      name: Answer for an amount that is not a whole number
      default: "Sorry, I did not get the amount."
      selector:
        text: {}

triggers:
  - trigger: conversation
    id: add
    command: !input add_sentences
  - trigger: conversation
    id: status
    command: !input status_sentences

variables:
  wanted: "{{ trigger.slots.challenge | default('') | trim | lower }}"
  # Today's number of the challenge with that name (empty if there is none).
  today_entity: >-
    {% set ns = namespace(found='') %}
    {% for entity_id in integration_entities('daily_challenge')
       if entity_id.startswith('number.') %}
      {% set device = device_id(entity_id) %}
      {% set name = device_attr(device, 'name_by_user')
         or device_attr(device, 'name') %}
      {% if name | lower == wanted %}{% set ns.found = entity_id %}{% endif %}
    {% endfor %}{{ ns.found }}

actions:
  - variables:
      challenge: "{{ trigger.slots.challenge | default('') | trim }}"
      raw_amount: "{{ trigger.slots.amount | default('') | string | trim }}"
      amount: "{{ raw_amount | int(0) }}"
  - if:
      - condition: template
        value_template: "{{ today_entity == '' }}"
    then:
      - set_conversation_response: !input unknown_answer
      - stop: Unknown challenge
  - variables:
      challenge: >-
        {{ device_attr(device_id(today_entity), 'name_by_user')
           or device_attr(device_id(today_entity), 'name') }}
  # Read the figures through the action: entity IDs depend on the language.
  - action: daily_challenge.get_status
    data:
      config_entry_id: "{{ config_entry_id(today_entity) }}"
    response_variable: before
  - if:
      - condition: template
        value_template: "{{ before.status != 'active' }}"
    then:
      - set_conversation_response: !input not_running_answer
      - stop: Not running
  - if:
      - condition: trigger
        id: add
    then:
      - if:
          - condition: template
            value_template: "{{ before.today_from_source }}"
        then:
          - set_conversation_response: !input source_answer
          - stop: Counted by a sensor
      # Number words ("twenty") and fractions are not taken as amounts.
      - if:
          - condition: template
            value_template: >-
              {{ amount == 0 or (raw_amount | float(0)) != amount }}
        then:
          - set_conversation_response: !input no_amount_answer
          - stop: No amount
      - action: daily_challenge.add
        data:
          config_entry_id: "{{ config_entry_id(today_entity) }}"
          amount: "{{ amount }}"
  - action: daily_challenge.get_status
    data:
      config_entry_id: "{{ config_entry_id(today_entity) }}"
    response_variable: status
  - variables:
      done: "{{ status.today }}"
      target: "{{ status.target }}"
      unit: "{{ status.unit }}"
      streak: "{{ status.current_streak }}"
  - choose:
      - conditions:
          - condition: trigger
            id: add
        sequence:
          - set_conversation_response: !input add_answer
    default:
      - set_conversation_response: !input status_answer

mode: parallel
