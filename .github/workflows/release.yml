name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Check version and attach ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match manifest version (vX.Y.Z)
        run: |
          version="$(jq -r .version custom_components/daily_challenge/manifest.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version v${version}"
            exit 1
          fi
      - name: Build ZIP
        run: |
          cd custom_components/daily_challenge
          zip -r "${GITHUB_WORKSPACE}/daily_challenge.zip" . -x '__pycache__/*'
      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" daily_challenge.zip --clobber
